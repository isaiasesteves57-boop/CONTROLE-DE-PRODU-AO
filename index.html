<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Gestor d Trader</title>
<meta name="description" content="Gestor d Trader — gestão de banca, jogos do dia, estratégias e ciclos para trading esportivo." />
<meta name="theme-color" content="#0a1410" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icons/icon.svg" />

<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<link rel="stylesheet" href="./css/gestor-trader.css" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
</style>
</head>
<body>
<div id="root"></div>

<script src="./js/firebase-config.js"></script>
<script>
  /* Projeto Firebase único e definitivo do Gestor d Trader (o mesmo do
     antigo Controle de Produção — decisão registrada na Etapa 1). */
  firebase.initializeApp(FIREBASE_CONFIG);
</script>
<script src="./js/utils.js"></script>
<script src="./js/store.js"></script>
<script>
  window.onerror = function(msg, src, line, col, err) {
    document.getElementById("root").innerHTML = '<div style="color:#e8e0cc;padding:20px;font-family:monospace;font-size:11px;white-space:pre-wrap;"><h2 style="color:#c6a15b;">Erro</h2><p style="color:#A6432D;">'+msg+'</p><p>Linha: '+line+'</p><p>Src: '+(src||'inline')+'</p><p style="color:#6a7d6a;font-size:10px;">'+(err&&err.stack?err.stack.substring(0,500):'')+'</p></div>';
  };
  setTimeout(function(){ if(!document.querySelector('#root > *')) { document.getElementById("root").innerHTML = '<div style="color:#e8e0cc;padding:20px;font-family:monospace;font-size:12px;"><h2 style="color:#A6432D;">App não carregou</h2><p style="color:#6a7d6a;">Babel pode ter falhado. Verifique a conexão e recarregue.</p></div>'; } }, 15000);
</script>
<script type="text/babel" data-presets="react" src="./js/gestor-app.js"></script>
<script type="text/babel" data-presets="react">
  try { ReactDOM.createRoot(document.getElementById("root")).render(<ErroLimite><App /></ErroLimite>); }
  catch(e) { console.error("RENDER ERROR:", e); document.getElementById("root").innerHTML=`<div style="color:#e8e0cc;padding:20px;font-family:monospace;font-size:12px;"><h2 style="color:#c6a15b;">Erro</h2><p>${e.message}</p></div>`; }
</script>
</body>
</html>
