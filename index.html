<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* ============ FIREBASE (opcional) ============
   Cole aqui a config do SEU projeto Firebase se quiser que os lançamentos

   o sistema funciona 100% localmente, salvo no navegador deste aparelho

   Recomendo um projeto Firebase separado do "personalizadas-brasil" para

*/
const firebaseConfig = {
  apiKey: "COLE_AQUI",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};

let db = null;
let firebaseReady = false;
try {
  if (firebaseConfig.apiKey !== "COLE_AQUI") {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    firebaseReady = true;
  }
} catch (e) { console.warn("Firebase não configurado ainda:", e); }

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function Icon({name, color="8d9aa1", size=18, className}){
  return <img src={`https://api.iconify.design/${name}.svg?color=%23${color}`} style={{width:size,height:size}} className={className} alt="" />;
}

/* ============ SEED DATA ============ */
const SEED_MACHINES = [
  {id:"auto-1", name:"Automática 1", type:"automatica", status:"parada", currentProduct:"", client:"", capacityHour:0, capacityDay:0},
  {id:"auto-2", name:"Automática 2", type:"automatica", status:"parada", currentProduct:"", client:"", capacityHour:0, capacityDay:0},
  {id:"auto-3", name:"Automática 3", type:"automatica", status:"parada", currentProduct:"", client:"", capacityHour:0, capacityDay:0},
  {id:"man-1", name:"Manual 1", type:"manual", status:"parada", currentProduct:"", client:"", capacityHour:0, capacityDay:0},
  {id:"man-2", name:"Manual 2", type:"manual", status:"parada", currentProduct:"", client:"", capacityHour:0, capacityDay:0},
];

const SEED_PRODUCTS = [
  {id:"agenda-classica", name:"Agenda Clássica", hasModels:true, models:["Espiral","Wero","Smart","Ficario"]},
  {id:"agenda-media", name:"Agenda Média", hasModels:false, models:[]},
  {id:"caderno-80", name:"Caderno 80 folhas", hasModels:false, models:[]},
  {id:"caderno-140", name:"Caderno 140 folhas", hasModels:false, models:[]},
  {id:"caderno-160", name:"Caderno 160 folhas", hasModels:false, models:[]},
];

/* ============ DATA HOOK (Firestore se configurado, senão localStorage) ============ */
function useCollection(name, seed){
  const storageKey = `furcao_${name}`;
  const [data, setData] = useState(() => {
    if (firebaseReady) return [];
    try {
      const raw = localStorage.getItem(storageKey);
      if (raw) return JSON.parse(raw);
    } catch(e){}
    return seed;
  });
  const [loaded, setLoaded] = useState(!firebaseReady);

  useEffect(() => {
    if (!firebaseReady) {
      try {
        const raw = localStorage.getItem(storageKey);
        if (!raw) localStorage.setItem(storageKey, JSON.stringify(seed));
      } catch(e){}
      setLoaded(true);
      return;
    }
    const unsub = db.collection(name).onSnapshot(async snap => {
      if (snap.empty && seed.length) {
        const batch = db.batch();
        seed.forEach(item => batch.set(db.collection(name).doc(item.id), item));
        await batch.commit();
        return;
      }
      setData(snap.docs.map(d => ({id:d.id, ...d.data()})));
      setLoaded(true);
    }, err => { console.warn(err); setLoaded(true); });
    return unsub;
  }, []);

  const persistLocal = (updater) => {
    setData(prev => {
      const next = updater(prev);
      try { localStorage.setItem(storageKey, JSON.stringify(next)); } catch(e){}
      return next;
    });
  };

  const add = async (item) => {
    const withId = {...item, id: item.id || uid()};
    if (firebaseReady) await db.collection(name).doc(withId.id).set(withId);
    else persistLocal(prev => [...prev, withId]);
    return withId;
  };
  const update = async (id, patch) => {
    if (firebaseReady) await db.collection(name).doc(id).update(patch);
    else persistLocal(prev => prev.map(it => it.id === id ? {...it, ...patch} : it));
  };
  const remove = async (id) => {
    if (firebaseReady) await db.collection(name).doc(id).delete();
    else persistLocal(prev => prev.filter(it => it.id !== id));
  };

  return {data, loaded, add, update, remove};
}

/* ============ HELPERS ============ */
function todayStr(){
  const d = new Date();
  const local = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return local.toISOString().slice(0,10);
}
function timeDiffHours(start, end){
  if (!start || !end) return 0;
  const [h1,m1] = start.split(":").map(Number);
  const [h2,m2] = end.split(":").map(Number);
  let mins = (h2*60+m2) - (h1*60+m1);
  if (mins < 0) mins += 24*60;
  return mins/60;
}
function fmt(n, digits=0){
  if (n === null || n === undefined || isNaN(n)) return "—";
  return Number(n).toLocaleString("pt-BR", {minimumFractionDigits:digits, maximumFractionDigits:digits});
}
function fmtDate(d){
  if (!d) return "—";
  const [y,m,day] = d.split("-");
  return `${day}/${m}/${y}`;
}

/* ============ GAUGE (índice de defeito) ============ */
function polarToXY(cx,cy,r,angleDeg){
  const rad = (angleDeg-90) * Math.PI/180;
  return {x: cx + r*Math.cos(rad), y: cy + r*Math.sin(rad)};
}
function describeArc(cx,cy,r,startAngle,endAngle){
  const start = polarToXY(cx,cy,r,startAngle);
  const end = polarToXY(cx,cy,r,endAngle);
  const largeArc = endAngle-startAngle <= 180 ? "0" : "1";
  return `M ${start.x} ${start.y} A ${r} ${r} 0 ${largeArc} 1 ${end.x} ${end.y}`;
}
function DefectGauge({value, max=5}){
  const v = Math.max(0, isNaN(value) ? 0 : value);
  const frac = Math.min(v, max) / max;
  const valueAngle = -90 + frac*180;
  const thresholdAngle = -90 + Math.min(1,max)/max*180;
  const ok = v <= 1;
  const color = ok ? "var(--ok)" : "var(--danger)";
  const cx=90, cy=86, r=68;
  return (
    <svg viewBox="0 0 180 100" className="w-full">
      <path d={describeArc(cx,cy,r,-90,90)} fill="none" stroke="var(--border-2)" strokeWidth="12" strokeLinecap="round" />
      <path d={describeArc(cx,cy,r,-90,valueAngle)} fill="none" stroke={color} strokeWidth="12" strokeLinecap="round" />
      {(() => {
        const p1 = polarToXY(cx,cy,r-9,thresholdAngle);
        const p2 = polarToXY(cx,cy,r+9,thresholdAngle);
        return <line x1={p1.x} y1={p1.y} x2={p2.x} y2={p2.y} stroke="var(--text-dim)" strokeWidth="2" />;
      })()}
      <text x={cx} y={cy-8} textAnchor="middle" className="f-display" style={{fontSize:"26px", fontWeight:800, fill:color}}>{fmt(v,2)}%</text>
      <text x={cx} y={cy+10} textAnchor="middle" style={{fontSize:"9px", fill:"var(--text-dim)", letterSpacing:"0.04em"}}>ÍNDICE DE DEFEITO</text>
      <text x={cx} y={cy+24} textAnchor="middle" style={{fontSize:"8px", fill:"var(--steel-dim)"}}>limite 1,00%</text>
    </svg>
  );
}

/* ============ HEADER + NAV ============ */
function Header({title, sub}){

        </div>
        <div className="min-w-0">
          <p className="f-display text-[17px] leading-none" style={{fontWeight:800}}>FURÇÃO <span className="rust-text">CENTRAL</span></p>

const NAV_ITEMS = [

  {id:"lancamento", label:"Lançar", icon:"mdi:plus-circle-outline"},

/* ============ STAT CARD ============ */
function StatCard({label, value, unit, icon}){
  return (
    <div className="card p-3.5">
      <div className="flex items-center justify-between mb-2">
        <span className="text-[10px] text-[var(--text-dim)] font-semibold uppercase tracking-wide">{label}</span>
        {icon && <Icon name={icon} size={15} color="4c5a61" />}
      </div>
      <p className="f-display leading-none" style={{fontSize:"26px", fontWeight:800}}>
        {value}<span className="text-[12px] text-[var(--text-dim)] ml-1" style={{fontFamily:"'IBM Plex Sans'"}}>{unit}</span>
      </p>
    </div>
  );
}

/* ============ DASHBOARD ============ */
function Dashboard({machines, products, productions}){
  const [date, setDate] = useState(todayStr());
  const dayProductions = useMemo(() => productions.filter(p => p.date === date), [productions, date]);

  const totalProduction = dayProductions.reduce((s,p)=>s+(Number(p.quantityProduced)||0), 0);
  const totalDefects = dayProductions.reduce((s,p)=>s+(Number(p.defects)||0), 0);
  const defectPct = totalProduction ? (totalDefects/totalProduction*100) : 0;
  const machinesWorking = machines.filter(m => m.status === "produzindo").length;

  const byMachine = useMemo(() => {
    const map = {};
    dayProductions.forEach(p => {
      if (!map[p.machineId]) map[p.machineId] = {machineId:p.machineId, machineName:p.machineName, production:0, defects:0};
      map[p.machineId].production += Number(p.quantityProduced)||0;
      map[p.machineId].defects += Number(p.defects)||0;
    });
    return Object.values(map);
  }, [dayProductions]);

  const maxProd = Math.max(1, ...byMachine.map(m=>m.production));
  const ranking = [...byMachine].sort((a,b)=>b.production-a.production);

  return (
    <div className="page-in px-4 pb-6">
      <div className="flex items-center justify-between mb-4">
        <span className="text-[11px] text-[var(--text-dim)] font-semibold">Visualizando</span>
        <input type="date" value={date} onChange={e=>setDate(e.target.value)} className="!w-auto text-[12px] py-1.5" />
      </div>

      <div className="grid grid-cols-2 gap-3 mb-3">
        <StatCard label="Produção do dia" value={fmt(totalProduction)} unit="un." icon="mdi:package-variant" />
        <StatCard label="Máquinas ativas" value={`${machinesWorking}/${machines.length}`} unit="" icon="mdi:cog-sync-outline" />
      </div>
      <div className="grid grid-cols-2 gap-3 mb-3">
        <StatCard label="Defeitos" value={fmt(totalDefects)} unit="un." icon="mdi:alert-circle-outline" />
        <div className="card p-2 flex items-center justify-center">
          <DefectGauge value={defectPct} />
        </div>
      </div>

      <p className="text-[11px] text-[var(--text-dim)] font-semibold uppercase tracking-wide mt-5 mb-2.5">Produção por máquina</p>
      <div className="card p-3.5 mb-3 space-y-3">
        {machines.length === 0 && <p className="text-[12px] text-[var(--text-dim)]">Nenhuma máquina cadastrada.</p>}
        {machines.map(m => {
          const rec = byMachine.find(b=>b.machineId===m.id);
          const prod = rec ? rec.production : 0;
          const pct = Math.min(100, (prod/maxProd)*100);
          const running = m.status === "produzindo";
          return (
            <div key={m.id} className="flex items-center gap-3">
              <div className="status-bar" style={{background: running ? "var(--ok)" : "var(--steel-dim)"}}></div>
              <div className="flex-1 min-w-0">
                <div className="flex items-center justify-between mb-1">
                  <span className="text-[12.5px] font-semibold truncate">{m.name}</span>
                  <span className="text-[12px] f-mono text-[var(--text-dim)]">{fmt(prod)} un.</span>
                </div>
                <div className="tick-row" style={{position:"relative"}}>
                  <div style={{position:"absolute", left:0, top:0, height:"100%", width:`${pct}%`, background: running?"var(--rust)":"var(--steel-dim)", borderRadius:"2px"}}></div>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      <p className="text-[11px] text-[var(--text-dim)] font-semibold uppercase tracking-wide mt-5 mb-2.5">Ranking das máquinas</p>
      <div className="card divide-y" style={{borderColor:"var(--border)"}}>
        {ranking.length === 0 && <p className="text-[12px] text-[var(--text-dim)] p-3.5">Sem lançamentos nesta data.</p>}
        {ranking.map((m,i) => (
          <div key={m.machineId} className="flex items-center gap-3 p-3" style={{borderColor:"var(--border)"}}>
            <div className="f-display flex items-center justify-center flex-shrink-0" style={{
              width:26, height:26, borderRadius:"7px", fontWeight:800, fontSize:"13px",
              background: i===0?"var(--rust)":"var(--card-2)", color: i===0?"#1a0d05":"var(--text-dim)"
            }}>{i+1}</div>
            <div className="flex-1 min-w-0">
              <p className="text-[12.5px] font-semibold truncate">{m.machineName}</p>
              <p className="text-[10.5px] text-[var(--text-dim)]">{fmt(m.defects)} defeitos · {m.production ? fmt(m.defects/m.production*100,2) : "0,00"}%</p>
            </div>
            <p className="f-mono text-[13px]" style={{fontWeight:600}}>{fmt(m.production)}</p>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ============ LANÇAMENTO ============ */
const emptyEntry = () => ({
  date: todayStr(), machineId:"", productId:"", model:"", client:"", operator:"",
  startTime:"", endTime:"", quantityProduced:"", defects:""
});

function Lancamento({machines, products, addProduction}){
  const [form, setForm] = useState(emptyEntry());
  const [saved, setSaved] = useState(false);
  const set = (k,v) => setForm(f => ({...f, [k]:v}));

  const machine = machines.find(m => m.id === form.machineId);
  const product = products.find(p => p.id === form.productId);

  const onMachineChange = (id) => {
    const m = machines.find(mm=>mm.id===id);
    setForm(f => ({...f, machineId:id, client: f.client || (m?m.client:""), }));
  };
  const onProductChange = (id) => {
    setForm(f => ({...f, productId:id, model:""}));
  };

  const hours = timeDiffHours(form.startTime, form.endTime);
  const qty = Number(form.quantityProduced)||0;
  const defects = Number(form.defects)||0;
  const perHour = hours>0 ? qty/hours : 0;
  const defectRate = qty>0 ? (defects/qty*100) : 0;
  const alert = defectRate > 1;

  const canSubmit = form.date && form.machineId && form.productId && form.operator && form.startTime && form.endTime && form.quantityProduced !== "";

  const handleSubmit = async () => {
    if (!canSubmit) return;
    await addProduction({
      date: form.date,
      machineId: form.machineId,
      machineName: machine ? machine.name : "",
      productId: form.productId,
      productName: product ? product.name : "",
      model: (product && product.hasModels) ? form.model : "",
      client: form.client,
      operator: form.operator,
      startTime: form.startTime,
      endTime: form.endTime,
      quantityProduced: qty,
      defects: defects,
      productionHours: hours,
      perHour: perHour,
      defectRate: defectRate,
      createdAt: Date.now(),
    });
    setForm(emptyEntry());
    setSaved(true);
    setTimeout(()=>setSaved(false), 2200);
  };

  return (
    <div className="page-in px-4 pb-6">
      <div className="card p-4 space-y-3.5 mb-4">
        <div>
          <label>Data</label>
          <input type="date" value={form.date} onChange={e=>set("date", e.target.value)} />
        </div>

        <div>
          <label>Máquina</label>
          <select value={form.machineId} onChange={e=>onMachineChange(e.target.value)}>
            <option value="">Selecione...</option>
            {machines.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
          </select>
        </div>

        <div className="grid grid-cols-2 gap-3">
          <div>
            <label>Produto</label>
            <select value={form.productId} onChange={e=>onProductChange(e.target.value)}>
              <option value="">Selecione...</option>
              {products.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </div>
          <div>
            <label>Modelo de furação</label>
            <select value={form.model} onChange={e=>set("model", e.target.value)} disabled={!product || !product.hasModels}>
              <option value="">{product && product.hasModels ? "Selecione..." : "N/A"}</option>
              {product && product.hasModels && product.models.map(mo => <option key={mo} value={mo}>{mo}</option>)}
            </select>
          </div>
        </div>

        <div className="grid grid-cols-2 gap-3">
          <div>
            <label>Cliente</label>
            <input value={form.client} onChange={e=>set("client", e.target.value)} placeholder="Nome do cliente" />
          </div>
          <div>
            <label>Operador</label>
            <input value={form.operator} onChange={e=>set("operator", e.target.value)} placeholder="Nome do operador" />
          </div>
        </div>

        <div className="grid grid-cols-2 gap-3">
          <div>
            <label>Hora início</label>
            <input type="time" value={form.startTime} onChange={e=>set("startTime", e.target.value)} />
          </div>
          <div>
            <label>Hora fim</label>
            <input type="time" value={form.endTime} onChange={e=>set("endTime", e.target.value)} />
          </div>
        </div>

        <div className="grid grid-cols-2 gap-3">
          <div>
            <label>Qtd. produzida</label>
            <input type="number" min="0" value={form.quantityProduced} onChange={e=>set("quantityProduced", e.target.value)} placeholder="0" />
          </div>
          <div>
            <label>Qtd. defeitos</label>
            <input type="number" min="0" value={form.defects} onChange={e=>set("defects", e.target.value)} placeholder="0" />
          </div>
        </div>
      </div>

      <p className="text-[11px] text-[var(--text-dim)] font-semibold uppercase tracking-wide mb-2.5">Cálculo automático</p>
      <div className="card p-4 grid grid-cols-3 gap-2.5 mb-4">
        <div>
          <p className="text-[9.5px] text-[var(--text-dim)] mb-1">Tempo</p>
          <p className="f-mono text-[15px] font-semibold">{hours>0 ? `${fmt(hours,2)}h` : "—"}</p>
        </div>
        <div>
          <p className="text-[9.5px] text-[var(--text-dim)] mb-1">Produção/h</p>
          <p className="f-mono text-[15px] font-semibold">{hours>0 ? fmt(perHour,1) : "—"}</p>
        </div>
        <div>
          <p className="text-[9.5px] text-[var(--text-dim)] mb-1">Defeito</p>
          <p className="f-mono text-[15px] font-semibold" style={{color: qty>0 ? (alert?"var(--danger)":"var(--ok)") : "var(--text)"}}>
            {qty>0 ? `${fmt(defectRate,2)}%` : "—"}
          </p>
        </div>
      </div>

      {qty>0 && alert && (
        <div className="rounded-lg p-3 mb-4 flex items-center gap-2.5" style={{background:"var(--danger-dim)", border:"1px solid #5c2622"}}>
          <Icon name="mdi:alert" color="e2483f" size={18} />
          <p className="text-[11.5px]" style={{color:"#ffb4af"}}>Índice de defeito acima de 1% — fora da meta.</p>
        </div>
      )}

      <button onClick={handleSubmit} disabled={!canSubmit} className="btn-primary w-full text-center" style={{opacity: canSubmit?1:0.4}}>
        {saved ? "Lançamento salvo ✓" : "Salvar lançamento"}
      </button>
    </div>
  );
}

/* ============ HISTÓRICO ============ */
function Historico({machines, products, productions, removeProduction}){
  const [f, setF] = useState({date:"", machineId:"", productId:"", client:"", model:""});
  const set = (k,v) => setF(prev => ({...prev, [k]:v}));

  const clients = useMemo(() => [...new Set(productions.map(p=>p.client).filter(Boolean))].sort(), [productions]);
  const allModels = useMemo(() => [...new Set(products.flatMap(p=>p.models||[]))].sort(), [products]);

  const filtered = useMemo(() => {
    return productions
      .filter(p => !f.date || p.date === f.date)
      .filter(p => !f.machineId || p.machineId === f.machineId)
      .filter(p => !f.productId || p.productId === f.productId)
      .filter(p => !f.client || p.client === f.client)
      .filter(p => !f.model || p.model === f.model)
      .sort((a,b) => (b.date+String(b.createdAt||0)).localeCompare(a.date+String(a.createdAt||0)));
  }, [productions, f]);

  return (
    <div className="page-in px-4 pb-6">
      <div className="card p-3.5 mb-4">
        <div className="grid grid-cols-2 gap-2.5 mb-2.5">
          <div>
            <label>Data</label>
            <input type="date" value={f.date} onChange={e=>set("date", e.target.value)} />
          </div>
          <div>
            <label>Máquina</label>
            <select value={f.machineId} onChange={e=>set("machineId", e.target.value)}>
              <option value="">Todas</option>
              {machines.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
            </select>
          </div>
        </div>
        <div className="grid grid-cols-2 gap-2.5 mb-2.5">
          <div>
            <label>Produto</label>
            <select value={f.productId} onChange={e=>set("productId", e.target.value)}>
              <option value="">Todos</option>
              {products.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </div>
          <div>
            <label>Modelo</label>
            <select value={f.model} onChange={e=>set("model", e.target.value)}>
              <option value="">Todos</option>
              {allModels.map(m => <option key={m} value={m}>{m}</option>)}
            </select>
          </div>
        </div>
        <div>
          <label>Cliente</label>
          <select value={f.client} onChange={e=>set("client", e.target.value)}>
            <option value="">Todos</option>
            {clients.map(c => <option key={c} value={c}>{c}</option>)}
          </select>
        </div>
        {(f.date||f.machineId||f.productId||f.client||f.model) && (
          <button onClick={()=>setF({date:"", machineId:"", productId:"", client:"", model:""})} className="btn-ghost mt-3">Limpar filtros</button>
        )}
      </div>

      <p className="text-[11px] text-[var(--text-dim)] font-semibold mb-2.5">{filtered.length} lançamento{filtered.length!==1?"s":""}</p>

      <div className="card overflow-x-auto">
        <table>
          <thead>
            <tr>
              <th>Data</th><th>Máquina</th><th>Produto</th><th>Modelo</th><th>Cliente</th>
              <th>Produção</th><th>Defeitos</th><th>%</th><th></th>
            </tr>
          </thead>
          <tbody>
            {filtered.map(p => {
              const alert = p.defectRate > 1;
              return (
                <tr key={p.id}>
                  <td>{fmtDate(p.date)}</td>
                  <td>{p.machineName}</td>
                  <td>{p.productName}</td>
                  <td>{p.model || "—"}</td>
                  <td>{p.client || "—"}</td>
                  <td className="f-mono">{fmt(p.quantityProduced)}</td>
                  <td className="f-mono">{fmt(p.defects)}</td>
                  <td className="f-mono font-semibold" style={{color: alert?"var(--danger)":"var(--ok)"}}>{fmt(p.defectRate,2)}%</td>
                  <td>
                    <button onClick={()=>{ if(confirm("Excluir este lançamento?")) removeProduction(p.id); }}>
                      <Icon name="mdi:trash-can-outline" size={15} color="6b767c" />
                    </button>
                  </td>
                </tr>
              );
            })}
            {filtered.length === 0 && (
              <tr><td colSpan="9" className="text-center text-[var(--text-dim)] py-6">Nenhum lançamento encontrado.</td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ============ CADASTROS ============ */
function MachineCard({m, products, updateMachine}){
  const [edit, setEdit] = useState(false);
  const [local, setLocal] = useState(m);
  useEffect(()=>setLocal(m), [m]);
  const set = (k,v)=>setLocal(l=>({...l,[k]:v}));
  const save = async () => { await updateMachine(m.id, local); setEdit(false); };
  const running = m.status === "produzindo";

  return (
    <div className="card p-3.5">
      <div className="flex items-center gap-2.5 mb-1">
        <div className="status-dot" style={{background: running?"var(--ok)":"var(--steel-dim)"}}></div>
        <p className="text-[13.5px] font-semibold flex-1">{m.name}</p>
        <span className="text-[9.5px] px-2 py-0.5 rounded-full" style={{background:"var(--card-2)", color:"var(--text-dim)"}}>{m.type === "automatica" ? "Automática" : "Manual"}</span>
        <button onClick={()=>setEdit(e=>!e)} className="btn-ghost">{edit?"Fechar":"Editar"}</button>
      </div>
      {!edit && (
        <div className="text-[11.5px] text-[var(--text-dim)] mt-2 space-y-0.5">
          <p>Status: <span style={{color: running?"var(--ok)":"var(--danger)"}}>{running?"Produzindo":"Parada"}</span></p>
          <p>Produto atual: {m.currentProduct || "—"}</p>
          <p>Cliente: {m.client || "—"}</p>
          <p>Capacidade: {fmt(m.capacityHour)}/h · {fmt(m.capacityDay)}/dia</p>
        </div>
      )}
      {edit && (
        <div className="space-y-2.5 mt-3">
          <div>
            <label>Status</label>
            <select value={local.status} onChange={e=>set("status", e.target.value)}>
              <option value="produzindo">Produzindo</option>
              <option value="parada">Parada</option>
            </select>
          </div>
          <div>
            <label>Produto atual</label>
            <select value={local.currentProduct} onChange={e=>set("currentProduct", e.target.value)}>
              <option value="">—</option>
              {products.map(p => <option key={p.id} value={p.name}>{p.name}</option>)}
            </select>
          </div>
          <div>
            <label>Cliente</label>
            <input value={local.client} onChange={e=>set("client", e.target.value)} />
          </div>
          <div className="grid grid-cols-2 gap-2.5">
            <div>
              <label>Capacidade/hora</label>
              <input type="number" min="0" value={local.capacityHour} onChange={e=>set("capacityHour", e.target.value)} />
            </div>
            <div>
              <label>Capacidade/dia</label>
              <input type="number" min="0" value={local.capacityDay} onChange={e=>set("capacityDay", e.target.value)} />
            </div>
          </div>
          <button onClick={save} className="btn-primary w-full">Salvar máquina</button>
        </div>
      )}
    </div>
  );
}

function ProductCard({p, updateProduct}){
  const [edit, setEdit] = useState(false);
  const [name, setName] = useState(p.name);
  const [hasModels, setHasModels] = useState(p.hasModels);
  const [modelsText, setModelsText] = useState((p.models||[]).join(", "));
  useEffect(()=>{ setName(p.name); setHasModels(p.hasModels); setModelsText((p.models||[]).join(", ")); }, [p]);

  const save = async () => {
    const models = hasModels ? modelsText.split(",").map(s=>s.trim()).filter(Boolean) : [];
    await updateProduct(p.id, {name, hasModels, models});
    setEdit(false);
  };

  return (
    <div className="card p-3.5">
      <div className="flex items-center gap-2.5">
        <p className="text-[13.5px] font-semibold flex-1">{p.name}</p>
        <button onClick={()=>setEdit(e=>!e)} className="btn-ghost">{edit?"Fechar":"Editar"}</button>
      </div>
      {!edit && p.hasModels && (
        <div className="flex flex-wrap gap-1.5 mt-2.5">
          {(p.models||[]).map(m => (
            <span key={m} className="text-[10.5px] px-2 py-1 rounded-md" style={{background:"var(--card-2)", color:"var(--text-dim)"}}>{m}</span>
          ))}
        </div>
      )}
      {edit && (
        <div className="space-y-2.5 mt-3">
          <div>
            <label>Nome do produto</label>
            <input value={name} onChange={e=>setName(e.target.value)} />
          </div>
          <label className="flex items-center gap-2 !mb-0 cursor-pointer">
            <input type="checkbox" checked={hasModels} onChange={e=>setHasModels(e.target.checked)} style={{width:"auto"}} />
            <span className="text-[11.5px] text-[var(--text)]">Possui modelos de furação</span>
          </label>
          {hasModels && (
            <div>
              <label>Modelos (separados por vírgula)</label>
              <input value={modelsText} onChange={e=>setModelsText(e.target.value)} placeholder="Espiral, Wero, Smart, Ficario" />
            </div>
          )}
          <button onClick={save} className="btn-primary w-full">Salvar produto</button>
        </div>
      )}
    </div>
  );
}

function AddMachineForm({addMachine}){
  const [open, setOpen] = useState(false);
  const [name, setName] = useState("");
  const [type, setType] = useState("automatica");
  const submit = async () => {
    if (!name.trim()) return;
    await addMachine({name:name.trim(), type, status:"parada", currentProduct:"", client:"", capacityHour:0, capacityDay:0});
    setName(""); setOpen(false);
  };
  if (!open) return <button onClick={()=>setOpen(true)} className="btn-outline w-full">+ Nova máquina</button>;
  return (
    <div className="card p-3.5 space-y-2.5">
      <div>
        <label>Nome</label>
        <input value={name} onChange={e=>setName(e.target.value)} placeholder="Ex.: Automática 4" />
      </div>
      <div>
        <label>Tipo</label>
        <select value={type} onChange={e=>setType(e.target.value)}>
          <option value="automatica">Automática</option>
          <option value="manual">Manual</option>
        </select>
      </div>
      <div className="flex gap-2">
        <button onClick={submit} className="btn-primary flex-1">Adicionar</button>
        <button onClick={()=>setOpen(false)} className="btn-outline flex-1">Cancelar</button>
      </div>
    </div>
  );
}

function AddProductForm({addProduct}){
  const [open, setOpen] = useState(false);
  const [name, setName] = useState("");
  const [hasModels, setHasModels] = useState(false);
  const [modelsText, setModelsText] = useState("");
  const submit = async () => {
    if (!name.trim()) return;
    const models = hasModels ? modelsText.split(",").map(s=>s.trim()).filter(Boolean) : [];
    await addProduct({name:name.trim(), hasModels, models});
    setName(""); setModelsText(""); setHasModels(false); setOpen(false);
  };
  if (!open) return <button onClick={()=>setOpen(true)} className="btn-outline w-full">+ Novo produto</button>;
  return (
    <div className="card p-3.5 space-y-2.5">
      <div>
        <label>Nome</label>
        <input value={name} onChange={e=>setName(e.target.value)} placeholder="Ex.: Agenda Executiva" />
      </div>
      <label className="flex items-center gap-2 !mb-0 cursor-pointer">
        <input type="checkbox" checked={hasModels} onChange={e=>setHasModels(e.target.checked)} style={{width:"auto"}} />
        <span className="text-[11.5px]">Possui modelos de furação</span>
      </label>
      {hasModels && (
        <div>
          <label>Modelos (separados por vírgula)</label>
          <input value={modelsText} onChange={e=>setModelsText(e.target.value)} placeholder="Espiral, Wero" />
        </div>
      )}
      <div className="flex gap-2">
        <button onClick={submit} className="btn-primary flex-1">Adicionar</button>
        <button onClick={()=>setOpen(false)} className="btn-outline flex-1">Cancelar</button>
      </div>
    </div>
  );
}

function Cadastros({machines, products, addMachine, updateMachine, addProduct, updateProduct}){
  const [tab, setTab] = useState("maquinas");
  return (
    <div className="page-in px-4 pb-6">
      <div className="flex gap-2 mb-4">
        <button onClick={()=>setTab("maquinas")} className={`btn-ghost ${tab==="maquinas"?"active":""}`}>Máquinas</button>
        <button onClick={()=>setTab("produtos")} className={`btn-ghost ${tab==="produtos"?"active":""}`}>Produtos</button>
      </div>

      {tab === "maquinas" && (
        <div className="space-y-3">
          {machines.map(m => <MachineCard key={m.id} m={m} products={products} updateMachine={updateMachine} />)}
          <AddMachineForm addMachine={addMachine} />
        </div>
      )}

      {tab === "produtos" && (
        <div className="space-y-3">
          {products.map(p => <ProductCard key={p.id} p={p} updateProduct={updateProduct} />)}
          <AddProductForm addProduct={addProduct} />
        </div>
      )}
    </div>
  );
}

/* ============ APP ROOT ============ */
function App(){
  const [page, setPage] = useState("dashboard");
  const machinesC = useCollection("furcao_machines", SEED_MACHINES);
  const productsC = useCollection("furcao_products", SEED_PRODUCTS);
  const productionsC = useCollection("furcao_productions", []);

  useEffect(()=>{ window.scrollTo(0,0); }, [page]);

  const titleMap = {
    dashboard: "Painel do dia",
    lancamento: "Lançar produção",
    historico: "Histórico de lançamentos",
    cadastros: "Máquinas e produtos",
  };

  return (
    <div className="app-shell">
      <Header title={titleMap[page]} />

      {page === "dashboard" && <Dashboard machines={machinesC.data} products={productsC.data} productions={productionsC.data} />}
      {page === "lancamento" && <Lancamento machines={machinesC.data} products={productsC.data} addProduction={productionsC.add} />}
      {page === "historico" && <Historico machines={machinesC.data} products={productsC.data} productions={productionsC.data} removeProduction={productionsC.remove} />}
      {page === "cadastros" && (
        <Cadastros
          machines={machinesC.data} products={productsC.data}
          addMachine={machinesC.add} updateMachine={machinesC.update}
          addProduct={productsC.add} updateProduct={productsC.update}
        />
      )}

      <div className="h-24" />
      <BottomNav page={page} setPage={setPage} />

      {!firebaseReady && (
        <div className="fixed top-3 left-1/2 -translate-x-1/2 z-50 text-[10px] px-3 py-1.5 rounded-full max-w-[90%] text-center" style={{background:"rgba(217,98,43,0.15)", border:"1px solid rgba(217,98,43,0.4)", color:"var(--rust-2)"}}>
          Modo local — dados salvos neste aparelho
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
