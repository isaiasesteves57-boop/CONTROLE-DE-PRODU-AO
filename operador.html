<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Controle de Produção — Operador</title>
<meta name="description" content="Tela do operador: inicie o turno, escolha o material e lance a produção do dia." />
<meta name="theme-color" content="#0a1526" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icons/icon.svg" />
<link rel="stylesheet" href="./css/app.css" />
<link rel="stylesheet" href="./css/operador.css" />
</head>
<body>
<div id="app"></div>

<script src="./js/firebase-config.js"></script>
<script>
  /* Carrega o Firebase APENAS se as chaves estiverem preenchidas.
     Sem isso, o app roda 100% local (localStorage). */
  if (typeof FIREBASE_CONFIG !== "undefined" && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey !== "COLE_AQUI") {
    document.write('<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"><\/script>');
    document.write('<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"><\/script>');
  }
</script>
<script src="./js/utils.js"></script>
<script src="./js/store.js"></script>
<script src="./js/operador-app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () { /* PWA opcional */ });
    });
  }
</script>
</body>
</html>
